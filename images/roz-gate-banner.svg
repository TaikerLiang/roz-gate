<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="vignette" cx="42%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#1C3843"/>
      <stop offset="100%" stop-color="#122630"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C86B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F5C86B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#vignette)"/>
  <!-- floor -->
  <rect y="520" width="1280" height="120" fill="#0F2129"/>

  <!-- portcullis, raised halfway -->
  <g fill="#0C1B22">
    <g id="bars">
      <path d="M150 0h16v270l-8 20-8-20z"/>
      <path d="M230 0h16v270l-8 20-8-20z"/>
      <path d="M310 0h16v270l-8 20-8-20z"/>
      <path d="M390 0h16v270l-8 20-8-20z"/>
      <path d="M470 0h16v270l-8 20-8-20z"/>
      <path d="M550 0h16v270l-8 20-8-20z"/>
    </g>
    <rect x="130" y="70" width="456" height="14"/>
    <rect x="130" y="190" width="456" height="14"/>
  </g>

  <!-- hanging lamp -->
  <line x1="380" y1="0" x2="380" y2="96" stroke="#0C1B22" stroke-width="4"/>
  <path d="M348 96h64l14 30h-92z" fill="#2F5560"/>
  <ellipse cx="380" cy="132" rx="30" ry="8" fill="#F5C86B" opacity="0.85"/>
  <!-- warm glow over the booth -->
  <ellipse cx="380" cy="330" rx="300" ry="240" fill="url(#lampGlow)"/>

  <!-- ══ the clerk: an original night-shift owl ══ -->
  <g>
    <!-- ear tufts -->
    <path d="M292 208l30 46 30-22z" fill="#5C4433"/>
    <path d="M468 208l-30 46-30-22z" fill="#5C4433"/>
    <!-- body -->
    <ellipse cx="380" cy="330" rx="118" ry="126" fill="#7A5C42"/>
    <!-- wings -->
    <path d="M268 300q-26 60 18 104 20-56 12-110z" fill="#5C4433"/>
    <path d="M492 300q26 60-18 104-20-56-12-110z" fill="#5C4433"/>
    <!-- belly feathers -->
    <ellipse cx="380" cy="368" rx="72" ry="76" fill="#A98762"/>
    <path d="M352 344l14 18 14-18 14 18 14-18" stroke="#8A6A4F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M344 380l14 18 14-18 14 18 14-18 14 18" stroke="#8A6A4F" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- cat-eye glasses, red frames, unimpressed half-lidded eyes -->
    <g>
      <path d="M282 262l24-14" stroke="#C4453A" stroke-width="6" stroke-linecap="round"/>
      <path d="M478 262l-24-14" stroke="#C4453A" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="336" cy="278" rx="42" ry="34" fill="#DCE8E2" stroke="#C4453A" stroke-width="7"/>
      <ellipse cx="424" cy="278" rx="42" ry="34" fill="#DCE8E2" stroke="#C4453A" stroke-width="7"/>
      <rect x="372" y="272" width="16" height="7" rx="3" fill="#C4453A"/>
      <!-- half-lidded stare -->
      <circle cx="336" cy="290" r="9" fill="#2A2018"/>
      <circle cx="424" cy="290" r="9" fill="#2A2018"/>
      <path d="M294 283a42 32 0 0 1 84 0z" fill="#7A5C42"/>
      <path d="M382 283a42 32 0 0 1 84 0z" fill="#7A5C42"/>
      <line x1="300" y1="283" x2="372" y2="283" stroke="#5C4433" stroke-width="3"/>
      <line x1="388" y1="283" x2="460" y2="283" stroke="#5C4433" stroke-width="3"/>
      <!-- glasses chain -->
      <path d="M296 290q-30 30-16 58" stroke="#F5C86B" stroke-width="3.5" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path d="M464 290q30 30 16 58" stroke="#F5C86B" stroke-width="3.5" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
    </g>
    <!-- beak -->
    <path d="M368 306l12 20 12-20z" fill="#E5A13C"/>
  </g>

  <!-- booth counter -->
  <rect x="128" y="392" width="504" height="128" fill="#24454F"/>
  <rect x="116" y="378" width="528" height="26" rx="6" fill="#2F5560"/>
  <rect x="128" y="470" width="504" height="10" fill="#1B3540"/>

  <!-- inbox stack -->
  <g>
    <rect x="168" y="342" width="96" height="12" rx="2" fill="#D8CBB4"/>
    <rect x="174" y="328" width="96" height="12" rx="2" fill="#E6DCC8"/>
    <rect x="170" y="314" width="96" height="12" rx="2" fill="#F2E9D8"/>
  </g>

  <!-- stamped paper sliding toward the gate -->
  <g transform="translate(0 14) rotate(-4 508 356)">
    <rect x="440" y="322" width="150" height="70" rx="4" fill="#F2E9D8"/>
    <line x1="454" y1="340" x2="560" y2="340" stroke="#B9AE97" stroke-width="4" stroke-linecap="round"/>
    <line x1="454" y1="354" x2="540" y2="354" stroke="#B9AE97" stroke-width="4" stroke-linecap="round"/>
    <g transform="rotate(-8 516 374)">
      <rect x="448" y="360" width="136" height="26" rx="4" fill="none" stroke="#C4453A" stroke-width="3.5"/>
      <text x="516" y="380" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="19" font-weight="700" fill="#C4453A" letter-spacing="2">APPROVED</text>
    </g>
  </g>
  <!-- stamp resting by the right wing -->
  <g transform="rotate(6 486 300)">
    <rect x="470" y="266" width="14" height="30" rx="5" fill="#5C4433"/>
    <rect x="458" y="294" width="38" height="14" rx="4" fill="#3D2F22"/>
  </g>

  <!-- ══ title block ══ -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace">
    <text x="720" y="248" font-size="21" letter-spacing="6" fill="#F5C86B">A CLAUDE CODE PLUGIN</text>
    <text x="714" y="342" font-size="94" font-weight="700" fill="#F2E9D8">roz-gate</text>
    <rect x="720" y="374" width="76" height="6" rx="3" fill="#C4453A"/>
    <text x="720" y="428" font-size="30" fill="#A9C4BC">No stamp, no merge.</text>
  </g>
</svg>
