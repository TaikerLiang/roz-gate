<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- GitHub App logo: composed for the circular mask — all content sits
       inside the inscribed circle; corners are sacrificial background. -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1C3843"/>
      <stop offset="100%" stop-color="#122630"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C86B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F5C86B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background (full bleed; the circle crop makes it a disc) -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- portcullis, raised — the gate behind the clerk -->
  <g fill="#0C1B22">
    <path d="M256 0h30v250l-15 34-15-34z"/>
    <path d="M384 0h30v290l-15 34-15-34z"/>
    <path d="M610 0h30v290l-15 34-15-34z"/>
    <path d="M738 0h30v250l-15 34-15-34z"/>
    <rect x="196" y="88" width="632" height="24"/>
  </g>

  <!-- warm lamp glow behind the owl -->
  <ellipse cx="512" cy="540" rx="470" ry="420" fill="url(#lampGlow)"/>

  <!-- Roz, the night-shift owl clerk (from the banner, re-centered) -->
  <g transform="translate(512 540) scale(2.55) translate(-380 -332)">
    <!-- ear tufts -->
    <path d="M292 208l30 46 30-22z" fill="#5C4433"/>
    <path d="M468 208l-30 46-30-22z" fill="#5C4433"/>
    <!-- body -->
    <ellipse cx="380" cy="330" rx="118" ry="126" fill="#7A5C42"/>
    <!-- wings -->
    <path d="M268 300q-26 60 18 104 20-56 12-110z" fill="#5C4433"/>
    <path d="M492 300q26 60-18 104-20-56-12-110z" fill="#5C4433"/>
    <!-- belly feathers -->
    <ellipse cx="380" cy="368" rx="72" ry="76" fill="#A98762"/>
    <path d="M352 344l14 18 14-18 14 18 14-18" stroke="#8A6A4F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M344 380l14 18 14-18 14 18 14-18 14 18" stroke="#8A6A4F" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- cat-eye glasses, red frames, unimpressed half-lidded eyes -->
    <g>
      <path d="M282 262l24-14" stroke="#C4453A" stroke-width="6" stroke-linecap="round"/>
      <path d="M478 262l-24-14" stroke="#C4453A" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="336" cy="278" rx="42" ry="34" fill="#DCE8E2" stroke="#C4453A" stroke-width="7"/>
      <ellipse cx="424" cy="278" rx="42" ry="34" fill="#DCE8E2" stroke="#C4453A" stroke-width="7"/>
      <rect x="372" y="272" width="16" height="7" rx="3" fill="#C4453A"/>
      <!-- half-lidded stare -->
      <circle cx="336" cy="290" r="9" fill="#2A2018"/>
      <circle cx="424" cy="290" r="9" fill="#2A2018"/>
      <path d="M294 283a42 32 0 0 1 84 0z" fill="#7A5C42"/>
      <path d="M382 283a42 32 0 0 1 84 0z" fill="#7A5C42"/>
      <line x1="300" y1="283" x2="372" y2="283" stroke="#5C4433" stroke-width="3"/>
      <line x1="388" y1="283" x2="460" y2="283" stroke="#5C4433" stroke-width="3"/>
      <!-- glasses chain -->
      <path d="M296 290q-30 30-16 58" stroke="#F5C86B" stroke-width="3.5" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path d="M464 290q30 30 16 58" stroke="#F5C86B" stroke-width="3.5" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
    </g>
    <!-- beak -->
    <path d="M368 306l12 20 12-20z" fill="#E5A13C"/>
  </g>
</svg>
