# Ours, merged by `docker compose` on top of the vendored docker-compose.yml:
# publish nothing but the web UI. The upstream file binds postgres, redis,
# clickhouse and minio to host ports (127.0.0.1:5432, :6379, :8123/:9000,
# :9090/:9091) that collide with whatever else runs on a dev machine; the
# exporter only needs :3000, and the services reach each other on the
# compose network.
services:
  langfuse-worker:
    ports: !override []
  clickhouse:
    ports: !override []
  minio:
    ports: !override []
  redis:
    ports: !override []
  postgres:
    ports: !override []
