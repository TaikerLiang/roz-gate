# SUT registry — model-portability benchmark rows.
# name: {mode: subscription|api, model: <id>, base_url?: <url>, key_env?: <VAR>}
# Keys live in env vars only: the registry holds variable NAMES, never values.
#
# opus is the fixed reference baseline (the protocol's ceiling reference, not
# necessarily the production loop's current operator); fable is the current
# operator's row. Both run on subscription auth.

opus:  {mode: subscription, model: claude-opus-5}
fable: {mode: subscription, model: claude-fable-5}

