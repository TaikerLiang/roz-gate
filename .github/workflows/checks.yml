name: checks
on: [push, pull_request]
jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hook unit tests
        run: python3 hooks/tests/run_tests.py
      - name: eval ledger lint tier
        run: python3 evals/lint/run_lint.py
      - name: naming convention (repo hygiene, tools/ — not the ledger)
        run: python3 tools/naming.py $(git ls-files)
      - uses: astral-sh/setup-uv@v5
      - name: ruff (code lint, dev dependency — not the ledger)
        run: uv run ruff check .
